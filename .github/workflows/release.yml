# Builds the App (NgheTruyen.exe) and publishes it as a GitHub Release.
# See docs/adr/0014-release-by-tag.md.
#
# Pushing a v* tag cuts a release. Running this by hand (workflow_dispatch) only
# builds the exe and keeps it as a workflow artifact, so the pipeline can be
# smoke-tested without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # gh release create

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # The App's tests import each other as top-level modules and the build
        # reads web/ by relative path, so everything runs from app/.
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs the tags, not just this commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      # PyInstaller is a build-time tool, so it is not in requirements.txt.
      # requirements.txt itself has no versions, so this bundles whatever pip
      # resolves that day -- see docs/adr/0014-release-by-tag.md.
      - name: Install the App's dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run the tests
        run: python -m unittest discover -s . -p "test_*.py"

      # See version.py: read back from the exe, shown in the Controls strip.
      # On a tag this is just the tag name (git describe on an exact tag
      # prints it as-is), the same as build.bat produces locally.
      - name: Write the version NgheTruyen.spec bundles
        run: git describe --tags --always --dirty | Out-File -Encoding utf8 VERSION

      # The build app/README.md documents: NgheTruyen.spec, which is what lists
      # web/, assets/ and the exe's icon. Running it rather than passing flags
      # is also what keeps the spec from being regenerated by a build, so a
      # release and a local build cannot drift.
      - name: Build NgheTruyen.exe
        run: python -m PyInstaller --noconfirm NgheTruyen.spec

      - name: Keep the exe as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NgheTruyen-exe
          path: app/dist/NgheTruyen.exe
          if-no-files-found: error

      # Only a tag publishes. The Sidecar is deliberately not part of this
      # (ADR-0012): it keeps its own venv and downloads its own voice model.
      # --notes-file is prepended to the notes GitHub generates from the
      # commits, and --verify-tag refuses to invent a tag that is not there.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" app/dist/NgheTruyen.exe
          --title "Nghe Truyện ${{ github.ref_name }}"
          --notes-file .github/release-notes.md
          --generate-notes
          --verify-tag
